[pytest]
testpaths = tests
pythonpath = .

# La rete e' spenta per default, e non solo a parole: senza questa riga il
# marcatore era soltanto dichiarato, e un `pytest` liscio eseguiva davvero i
# test che escono su internet. Per farli girare apposta: `pytest -m network`.
addopts = -m "not network"

markers =
    network: il test apre connessioni vere (escluso dai giri normali)
